services:
  netdash:
    build: .
    container_name: netdash
    restart: unless-stopped
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - NETDASH_HTTP_PORT=4000
      - NETDASH_WS_PORT=4001
      - NETDASH_ALLOWED_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
