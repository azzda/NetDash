services:
  netdash:
    # Local build by default; `NETDASH_IMAGE=ghcr.io/azzda/netdash:sha-abc1234 docker compose up`
    # runs the exact artifact CI published instead.
    image: ${NETDASH_IMAGE:-netdash:local}
    build:
      context: .
      args:
        NETDASH_VERSION: ${NETDASH_VERSION:-dev}
        NETDASH_COMMIT: ${NETDASH_COMMIT:-local}
    container_name: netdash
    restart: unless-stopped
    ports:
      - "${NETDASH_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - NETDASH_HTTP_PORT=4000
      - NETDASH_WS_PATH=/ws
      - NETDASH_ALLOWED_ORIGIN=${NETDASH_ALLOWED_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
