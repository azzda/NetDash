apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# PROD environment — promotion only. `newTag` is written by CI when a `v*` git
# tag is pushed (e.g. v0.2.0 -> newTag 0.2.0), never on a plain main push.
namespace: netdash

resources:
  - ../../base

images:
  - name: ghcr.io/azzda/netdash
    newTag: latest

configMapGenerator:
  - name: netdash-env
    literals:
      - NODE_ENV=production
      - NETDASH_HTTP_PORT=4000
      - NETDASH_WS_PATH=/ws
      - NETDASH_ALLOWED_ORIGIN=https://netdash.lab.azzda.cloud

patches:
  - target:
      kind: Ingress
      name: netdash
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: netdash.lab.azzda.cloud
      - op: replace
        path: /spec/tls/0/hosts/0
        value: netdash.lab.azzda.cloud
  - target:
      kind: Deployment
      name: netdash
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
