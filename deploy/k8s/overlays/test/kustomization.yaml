apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TEST environment — auto-deployed. CI rewrites `newTag` below on every green
# push to main, Argo CD syncs it. Never edit newTag by hand.
namespace: netdash-test

resources:
  - ../../base

images:
  - name: ghcr.io/azzda/netdash
    newTag: sha-71f2818

configMapGenerator:
  - name: netdash-env
    literals:
      - NODE_ENV=production
      - NETDASH_HTTP_PORT=4000
      - NETDASH_WS_PATH=/ws
      - NETDASH_ALLOWED_ORIGIN=https://netdash-test.lab.azzda.cloud
      # Real topology from NetBox. The token comes from the netdash-secrets
      # Secret (SOPS-managed in the azzdacloud repo) and is read-only.
      # The Service is addressed directly rather than hairpinning through
      # Traefik; netbox's allowedHosts includes this name.
      - NETDASH_SOURCE=netbox
      - NETBOX_URL=http://netbox.netbox.svc.cluster.local
      - NETBOX_SITE=azzda-hq
      - NETDASH_REFRESH_INTERVAL_MS=60000
      # Live state overlaid on the NetBox structure: blackbox probe_success
      # decides whether a device is actually up, and probe latency becomes a
      # real metric series. Without this, status is NetBox's intent only.
      - NETDASH_PROMETHEUS_URL=http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      - NETDASH_METRICS_HISTORY_MINUTES=60
      # Authentication. The client secret and session secret come from the
      # netdash-secrets Secret; only non-sensitive settings live here.
      # Access requires the app-netdash group; homelab-admins grants admin.
      - NETDASH_AUTH=oidc
      - NETDASH_OIDC_ISSUER=https://auth.azzda.cloud/realms/homelab
      - NETDASH_OIDC_CLIENT_ID=netdash
      - NETDASH_PUBLIC_URL=https://netdash-test.lab.azzda.cloud
      - NETDASH_ALLOWED_GROUPS=app-netdash
      - NETDASH_ADMIN_GROUPS=homelab-admins

patches:
  - target:
      kind: Ingress
      name: netdash
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: netdash-test.lab.azzda.cloud
      - op: replace
        path: /spec/tls/0/hosts/0
        value: netdash-test.lab.azzda.cloud
