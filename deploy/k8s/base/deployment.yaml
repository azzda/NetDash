apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdash
  labels:
    app.kubernetes.io/name: netdash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netdash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netdash
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: netdash
          # Tag is pinned per environment by the overlay (CI writes it back).
          image: ghcr.io/azzda/netdash:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: netdash-env
            # Credentials for the upstream data sources (e.g. the NetBox token).
            # Optional so the mock-only path needs no secret at all.
            - secretRef:
                name: netdash-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
