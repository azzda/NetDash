# Mirrors the azzdacloud baseline: default-deny INGRESS, allowing only the same
# namespace, Traefik (the single web entry path) and Prometheus scrapes.
# Egress is intentionally left open, same as the platform baseline.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: baseline-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
